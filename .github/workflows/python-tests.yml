name: Python tests
on:
  push:
    paths:
      - "solana-bot/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "solana-bot/**"
      - ".github/workflows/python-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python -m py_compile bot.py main.py trading/paper.py dashboard/app.py
