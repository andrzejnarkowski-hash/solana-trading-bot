name: Python tests
on:
  push:
    paths:
      - "solana-bot/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "solana-bot/**"
      - ".github/workflows/python-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: solana-bot/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python -m py_compile config.py bot.py main.py backtesting.py trading/paper.py dashboard/app.py risk/onchain.py risk/holders.py intelligence/scoring.py intelligence/x_monitor.py
